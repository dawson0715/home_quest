stages:
  - deploy

deploy:
  stage: deploy
  only:
    - main
  dependencies:
    - build
  image: yiisoftware/yii2-php:8.1-apache
  before_script:
    - rm -rf deploy
    - apt update && apt install -y openssh-client rsync curl
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir ~/.ssh
    - echo $'Host *\n\tStrictHostKeyChecking no' > ~/.ssh/config
  script:
    - composer install --no-dev
    - find . -type f -exec chmod 0644 {} +
    - find . -type d -exec chmod 0755 {} +
    - rsync -arv --delete --exclude=.* 
      --exclude=/*.* 
      --exclude=ReactAsset.php 
      --exclude=/web/index.php 
      --exclude=/runtime 
      --exclude=/config 
      . deploy@remote.deplot.xyz:/var/www-chicco
  environment:
    name: production
    url: https://chicco.deplot.xyz/docs
