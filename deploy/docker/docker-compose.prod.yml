# Production stack (Ubuntu VPS). Usage, from this directory:
#   cp .env.example .env   # fill in the secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec app php yii migrate --interactive=0
# Alternative to the host setup in deploy/apache (docs/08-deploy.md, "Variante Docker").
name: homequest

x-app: &app
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  image: homequest-app
  env_file: .env
  environment:
    HQ_ENV: prod
    TZ: Europe/Rome
    DB_HOST: db
    # Caddy is the only client: trust its X-Forwarded-For (rate limits per real IP)
    TRUSTED_PROXIES: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
  volumes:
    - uploads:/app/web/uploads
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app

  cron:
    <<: *app
    command: ["hq-cron"]

  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file: .env
    environment:
      TZ: Europe/Rome
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      retries: 30
    restart: unless-stopped

  backup:
    image: mysql:8.0
    env_file: .env
    environment:
      TZ: Europe/Rome
    entrypoint: ["sh", "/backup.sh"]
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    env_file: .env
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db-data:
  uploads:
  backups:
  caddy-data:
  caddy-config:
