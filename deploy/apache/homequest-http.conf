# Step 1 (before the certificate): HTTP only, used by certbot to prove the domain.
# /etc/apache2/sites-available/homequest.conf — full setup in docs/09-apache-e-cicd.md
<VirtualHost *:80>
    ServerName homequest.deplot.xyz
    DocumentRoot /var/www-homequest/public

    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot>
        Require all granted
    </Directory>

    <Directory /var/www-homequest/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
