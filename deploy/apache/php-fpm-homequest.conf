; PHP-FPM pool for the HomeQuest API: /etc/php/8.3/fpm/pool.d/homequest.conf
; Runs as `deploy` (owner of the files copied by CI, of runtime/ and uploads/),
; reached by Apache through the socket below.
[homequest]
user = deploy
group = deploy
listen = /run/php/homequest-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[date.timezone] = Europe/Rome
; recipe photos: max 5 MB (API), a bit of margin for the multipart body
php_admin_value[upload_max_filesize] = 6M
php_admin_value[post_max_size] = 7M
php_admin_value[memory_limit] = 256M
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_value[error_log] = /var/www-homequest/backend/runtime/logs/php-error.log
