# HomeQuest on the server, final configuration (HTTPS):
#   /            → web app, static build in /var/www-homequest/public (copied by CI)
#   /api/*       → Yii (backend/web/index.php) via the PHP-FPM pool `homequest`
#   /uploads/*   → recipe photos (backend/web/uploads)
# /etc/apache2/sites-available/homequest.conf — full setup in docs/09-apache-e-cicd.md
# Modules: a2enmod proxy_fcgi setenvif headers rewrite ssl http2 deflate

<VirtualHost *:80>
    ServerName homequest.deplot.xyz

    # certificate renewals keep working over HTTP
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName homequest.deplot.xyz
    DocumentRoot /var/www-homequest/public
    # HTTP/2 needs mpm_event (default with PHP-FPM; mpm_prefork falls back to HTTP/1.1)
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/homequest.deplot.xyz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/homequest.deplot.xyz/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # ---- API → Yii front controller (PHP-FPM) -----------------------------
    # Every /api/... URL runs backend/web/index.php; Yii routes on REQUEST_URI.
    AliasMatch "^/api/" "/var/www-homequest/backend/web/index.php"

    # ---- Recipe photos (static files written by the API) ------------------
    Alias /uploads/ /var/www-homequest/backend/web/uploads/

    <Directory /var/www-homequest/backend/web>
        Options -Indexes
        AllowOverride None
        # nothing in backend/web is public except index.php and uploads/
        Require all denied
        <Files index.php>
            Require all granted
            # pass "Authorization: Bearer ..." to PHP
            CGIPassAuth On
            SetHandler "proxy:unix:/run/php/homequest-fpm.sock|fcgi://localhost"
        </Files>
    </Directory>
    <Directory /var/www-homequest/backend/web/uploads>
        Options -Indexes
        Require all granted
        # images only, never executed or rendered as documents
        RemoveHandler .php .phtml
        SetHandler none
        Header always set X-Content-Type-Options "nosniff"
        Header always set Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox"
    </Directory>

    # ---- Web app (SvelteKit static build) ----------------------------------
    <Directory /var/www-homequest/public>
        Options -Indexes
        AllowOverride None
        Require all granted

        # SPA: anything that is not a real file is the app (client-side routing);
        # missing app assets stay 404 instead of returning the HTML page
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^ - [L]
        RewriteRule ^_app/ - [R=404,L]
        RewriteRule ^ /index.html [L]

        # CSP for the app is a <meta> generated by SvelteKit (script hashes)
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "same-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
        <FilesMatch "^(index\.html|service-worker\.js|manifest\.webmanifest)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </Directory>
    <Directory /var/www-homequest/public/_app/immutable>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
    DirectoryIndex index.html

    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json application/manifest+json image/svg+xml

    # access log without query strings (no personal data in logs)
    LogFormat "%a %t \"%m %U\" %>s %b" homequest
    CustomLog ${APACHE_LOG_DIR}/homequest.access.log homequest
    ErrorLog ${APACHE_LOG_DIR}/homequest.error.log
</VirtualHost>
